<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mic Test">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<title>Mic Test</title>
<!--
  Phase 0 microphone spike (spec section 10). No build step, no dependencies.
  Records 5 seconds with getUserMedia + MediaRecorder, shows the live level from an
  AnalyserNode, plays the clip back, and releases the microphone right after.
  Every attempt is logged in localStorage so results survive force-closing the app
  and the iPad sleeping. Nothing is uploaded anywhere.
-->
<style>
  :root {
    color-scheme: light only;
    --ink: #2b2118; --ink-2: #5a4836;
    --glass: rgba(255,252,246,.5);
    --edge: 1px solid rgba(255,255,255,.72);
    --shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 14px 36px rgba(92,62,32,.16);
    --ok: #3f6b3a; --bad: #9a3b16;
  }
  html, body { margin: 0; height: 100%; overscroll-behavior: none; }
  body {
    background: linear-gradient(135deg, #f5eee2, #dcc4a2);
    color: var(--ink);
    font: 16px/1.4 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  main {
    box-sizing: border-box; height: 100%;
    padding: max(28px, env(safe-area-inset-top)) 40px 28px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 28px;
  }
  .card {
    background: var(--glass); border: var(--edge); box-shadow: var(--shadow);
    -webkit-backdrop-filter: blur(30px) saturate(1.7); backdrop-filter: blur(30px) saturate(1.7);
    border-radius: 28px; padding: 24px 26px; box-sizing: border-box; min-height: 0;
  }
  .left { display: flex; flex-direction: column; gap: 18px; }
  h1 { margin: 0; font: 400 44px/1 "Bodoni 72", Didot, serif; }
  h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
  .env { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 15px; }
  .env dt { color: var(--ink-2); }
  .env dd { margin: 0; font-weight: 600; }
  .good { color: var(--ok); } .warn { color: var(--bad); }
  #record {
    appearance: none; border: 0; cursor: pointer;
    height: 76px; border-radius: 38px; font-family: inherit; font-size: 22px; font-weight: 600;
    background: #fff; color: var(--ink); box-shadow: 0 10px 24px rgba(0,0,0,.14);
  }
  #record:disabled { opacity: .55; }
  .meter { height: 14px; border-radius: 7px; background: rgba(43,33,24,.12); overflow: hidden; }
  .meter > div { height: 100%; width: 0; background: var(--ink); border-radius: 7px; transition: width 60ms linear; }
  #status { font-weight: 600; min-height: 1.4em; }
  audio { width: 100%; }
  .right { display: flex; flex-direction: column; }
  .loghead { display: flex; justify-content: space-between; align-items: baseline; }
  #clear { appearance: none; border: var(--edge); background: var(--glass); border-radius: 18px;
           height: 36px; padding: 0 16px; font-family: inherit; font-size: 14px; font-weight: 600; color: var(--ink); }
  #log { list-style: none; margin: 8px 0 0; padding: 0; overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
  #log li { padding: 9px 0; border-top: 1px solid rgba(43,33,24,.1); font-size: 14px; }
  #log li:first-child { border-top: 0; }
  #log li b { font-size: 15px; }
  #log li span { color: var(--ink-2); }
  .steps { margin: 0; padding-left: 20px; font-size: 15px; line-height: 1.7; color: var(--ink-2); }
</style>
</head>
<body>
<main>
  <section class="card left">
    <h1>Mic Test</h1>
    <dl class="env" id="env"></dl>
    <button id="record" type="button">Record 5 seconds</button>
    <div class="meter" aria-hidden="true"><div id="level"></div></div>
    <div id="status" role="status"></div>
    <audio id="player" controls playsinline></audio>
    <ol class="steps">
      <li>Record from the Home Screen app, then tap play.</li>
      <li>Force-close it (swipe up), reopen, record again.</li>
      <li>Lock the iPad, wait a minute, unlock, record again.</li>
    </ol>
  </section>
  <section class="card right">
    <div class="loghead"><h2>Attempts (newest first)</h2><button id="clear" type="button">Clear</button></div>
    <ol id="log"></ol>
  </section>
</main>
<script>
(() => {
  const LOG_KEY = "micTest.log";
  const SECONDS = 5;
  const $ = (id) => document.getElementById(id);

  const standalone = navigator.standalone === true ||
    matchMedia("(display-mode: standalone)").matches;
  const types = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm"];
  const mimeType = window.MediaRecorder
    ? types.find((t) => MediaRecorder.isTypeSupported(t)) || ""
    : null;

  function row(label, value, ok) {
    return `<dt>${label}</dt><dd class="${ok === undefined ? "" : ok ? "good" : "warn"}">${value}</dd>`;
  }
  $("env").innerHTML =
    row("Address", location.protocol === "https:" ? "HTTPS" : location.protocol.replace(":", "").toUpperCase(),
        window.isSecureContext) +
    row("Opened as", standalone ? "Home Screen app" : "Browser tab", standalone) +
    row("Microphone API", navigator.mediaDevices?.getUserMedia ? "Available" : "Missing",
        !!navigator.mediaDevices?.getUserMedia) +
    row("Recorder", mimeType === null ? "Missing" : mimeType || "No supported type", !!mimeType);

  function readLog() {
    try { return JSON.parse(localStorage.getItem(LOG_KEY) || "[]"); } catch { return []; }
  }
  function addLog(entry) {
    const log = [{ at: new Date().toISOString(), standalone, ...entry }, ...readLog()].slice(0, 40);
    try { localStorage.setItem(LOG_KEY, JSON.stringify(log)); } catch {}
    renderLog();
  }
  function renderLog() {
    const log = readLog();
    $("log").innerHTML = log.length ? log.map((e) => {
      const when = new Date(e.at).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit" });
      const where = e.standalone ? "Home Screen app" : "Browser tab";
      const what = e.note
        ? `<span>Opened</span>`
        : e.ok
        ? `<b class="good">Recorded</b> <span>${(e.bytes / 1024).toFixed(0)} KB · ${e.mime} · peak level ${e.peak}%</span>`
        : `<b class="warn">Failed</b> <span>${e.error}</span>`;
      return `<li>${what}<br><span>${when} · ${where}</span></li>`;
    }).join("") : `<li><span>No attempts yet.</span></li>`;
  }
  $("clear").onclick = () => { try { localStorage.removeItem(LOG_KEY); } catch {} renderLog(); };
  renderLog();

  // Log page loads too, so reopen and wake events show up between attempts.
  addLog({ note: true });
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") $("status").textContent = "Back in the foreground. Try recording again.";
  });

  $("record").onclick = async () => {
    const btn = $("record");
    btn.disabled = true;
    $("status").textContent = "Asking for the microphone…";
    let stream, ctx, raf, peak = 0;
    const cleanUp = () => {
      cancelAnimationFrame(raf);
      $("level").style.width = "0";
      // Release the microphone right away (spec risk 2).
      stream?.getTracks().forEach((t) => t.stop());
      ctx?.close().catch(() => {});
      btn.disabled = false;
    };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      ctx = new (window.AudioContext || window.webkitAudioContext)();
      const analyser = ctx.createAnalyser();
      analyser.fftSize = 1024;
      ctx.createMediaStreamSource(stream).connect(analyser);
      const buf = new Float32Array(analyser.fftSize);
      const draw = () => {
        analyser.getFloatTimeDomainData(buf);
        let sum = 0;
        for (const v of buf) sum += v * v;
        const level = Math.min(100, Math.round(Math.sqrt(sum / buf.length) * 400));
        peak = Math.max(peak, level);
        $("level").style.width = level + "%";
        raf = requestAnimationFrame(draw);
      };
      draw();

      const rec = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      const chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      const done = new Promise((res, rej) => { rec.onstop = res; rec.onerror = (e) => rej(e.error || e); });
      rec.start();
      let left = SECONDS;
      $("status").textContent = `Recording… ${left}`;
      const countdown = setInterval(() => {
        left -= 1;
        if (left > 0) $("status").textContent = `Recording… ${left}`;
      }, 1000);
      setTimeout(() => { clearInterval(countdown); rec.state !== "inactive" && rec.stop(); }, SECONDS * 1000);
      await done;
      cleanUp();

      const blob = new Blob(chunks, { type: rec.mimeType || mimeType || "audio/mp4" });
      if (!blob.size) throw new Error("Recording was empty (0 bytes)");
      const player = $("player");
      if (player.src) URL.revokeObjectURL(player.src);
      player.src = URL.createObjectURL(blob);
      $("status").textContent = peak < 3
        ? "Recorded, but the level stayed near zero. Was anyone speaking?"
        : "Recorded. Tap play to hear it.";
      addLog({ ok: true, bytes: blob.size, mime: blob.type, peak });
    } catch (err) {
      cleanUp();
      const msg = `${err?.name || "Error"}: ${err?.message || err}`;
      $("status").textContent = `Failed. ${msg}`;
      addLog({ ok: false, error: msg });
    }
  };
})();
</script>
</body>
</html>
